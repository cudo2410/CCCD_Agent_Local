[COMMON_CONFIG]

#Supported output image DPIs: 500, 400, 300
dpi=300

#Range is from -13 to -1
exposure=-1

#Range is from -64 to 64
brightness=0

#Range is from 0 to 64
contrast=0

#Range is from 0 to 128
saturation=0

#Brightness calibration, not recommended
isCalibrateBrightnessIR=0
isCalibrateBrightnessWH=0
isCalibrateBrightnessUV=0

#The interval between the two sensor lights
sensorGapTime=120

#A sensor lights on for the duration of the light
sensorDelayTime=500

#Dont change
beepFlag=0

#1 write calibration data on flash and computer, 0 only write on computer
flashFlag=1

#vid/pid 0x0C45/0x0415 0x0C46/0x0416 0x0018/0x2000
vid=0x0C45
pid=0x0415

#Crop card, Set gain and offset
